<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#04437C">
<link rel="icon" type="image/png" href="assets/img/favicon.png">
<link rel="apple-touch-icon" href="assets/img/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@500;600;700&family=Reem+Kufi:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/main.css">
<meta name="robots" content="noindex">
<title>التحقق من المهمة · Dz2link</title>
</head>
<body>
<div class="app narrow">
  <h1 class="logo small"><a href="./"><img src="assets/img/logo.jpg" alt="Dz2link" width="800" height="340"></a></h1>
  <main>
    <section class="state-card" id="stateCard" data-state="wait" aria-live="polite">
      <div class="state-ico" id="stIcon"></div>
      <h1 id="stTitle">جارٍ التحقق…</h1>
      <p id="stText"></p>
      <form id="uidForm" hidden novalidate>
        <label class="lb" for="uid">Binance ID (أرقام فقط)</label>
        <input class="field" id="uid" inputmode="numeric" autocomplete="off" maxlength="12" placeholder="123456789" aria-describedby="uidHint uidErr">
        <p class="hint" id="uidHint" style="text-align:start">تجده في تطبيق بينانس: الملف الشخصي ثم User ID.</p>
        <p class="err" id="uidErr" role="alert"></p>
        <button class="btn" id="submitBtn" type="submit">سجّل مشاركتي</button>
      </form>
      <div id="stActions"></div>
    </section>
  </main>
  <footer>مشاركة واحدة لكل Binance ID في كل جولة. لن نطلب منك كلمة مرور أو مفتاح API أبداً.</footer>
</div>
<script type="module" src="assets/js/verify.js"></script>
</body>
</html>
